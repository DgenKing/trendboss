<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <!-- neon green -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#19f7a3"/>
      <stop offset="100%" stop-color="#2bd4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19f7a3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#19f7a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="320" rx="20" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1c2a40" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
  </g>

  <!-- pulsing glow behind the mascot -->
  <circle cx="175" cy="135" r="120" fill="url(#glow)">
    <animate attributeName="r" values="100;130;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== PIG MASCOT ===== -->
  <g transform="translate(175 130)" filter="url(#soft)">
    <!-- gentle bob -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -13; 0 0" dur="3s" repeatCount="indefinite" additive="sum"/>

    <!-- curly tail (wiggles) -->
    <path d="M70 30 q26 -2 24 18 q-2 16 -18 12 q-12 -3 -6 -14" fill="none"
          stroke="url(#neon)" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        values="-6 70 30; 8 70 30; -6 70 30" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- ears (floppy triangles) -->
    <path d="M-66 -52 Q-92 -88 -50 -84 Q-44 -64 -40 -56 Z" fill="#14213a" stroke="url(#neon)" stroke-width="3"/>
    <path d="M 66 -52 Q 92 -88 50 -84 Q 44 -64 40 -56 Z" fill="#14213a" stroke="url(#neon)" stroke-width="3"/>

    <!-- head (round and chubby) -->
    <path d="M-72 -20 Q-78 60 0 72 Q78 60 72 -20 Q72 -70 0 -76 Q-72 -70 -72 -20 Z"
          fill="#14213a" stroke="url(#neon)" stroke-width="3"/>

    <!-- big pig snout -->
    <ellipse cx="0" cy="40" rx="40" ry="26" fill="#0c1430" stroke="url(#neon)" stroke-width="3"/>
    <ellipse cx="-15" cy="40" rx="6" ry="9" fill="#19f7a3"/>
    <ellipse cx="15"  cy="40" rx="6" ry="9" fill="#19f7a3"/>

    <!-- cool shades -->
    <g>
      <rect x="-58" y="-18" width="48" height="26" rx="6" fill="#05221a" stroke="url(#neon)" stroke-width="3"/>
      <rect x="10"  y="-18" width="48" height="26" rx="6" fill="#05221a" stroke="url(#neon)" stroke-width="3"/>
      <line x1="-10" y1="-8" x2="10" y2="-8" stroke="url(#neon)" stroke-width="3"/>
      <!-- glint sweeping across the lens -->
      <line x1="-54" y1="6" x2="-44" y2="-14" stroke="#bdfff0" stroke-width="3" opacity="0.9">
        <animate attributeName="x1" values="-54;-14;-54" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-44;-4;-44"  dur="2.4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ===== ANIMATED UPTREND LINE ===== -->
  <polyline points="430,250 500,220 560,235 620,180 690,200 760,120 840,90"
            fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#soft)" stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" values="600;0" dur="2s" fill="freeze" repeatCount="indefinite"/>
  </polyline>
  <!-- traveling pulse dot on the trend -->
  <circle r="6" fill="#bdfff0">
    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto"
      path="M430,250 L500,220 L560,235 L620,180 L690,200 L760,120 L840,90"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- arrow head at the top -->
  <path d="M840 90 l-18 4 l8 -16 z" fill="#19f7a3"/>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(430 150)">
    <text x="0" y="0" font-size="62" font-weight="800" fill="url(#neon)" letter-spacing="1">
      TREND BO$$
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="2" y="34" font-size="20" font-weight="500" fill="#8aa0c6" letter-spacing="6">
      HYPERLIQUID TREND MONITOR
    </text>
  </g>
</svg>
